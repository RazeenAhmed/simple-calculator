name: Calculator CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Core Files Exist
        run: |
          test -f index.html || exit 1
          test -f style.css || exit 1
          test -f script.js || exit 1
          echo "All core files exist."

      - name: HTML Syntax Check
        run: |
          grep -q "<!DOCTYPE html>" index.html || exit 1
          echo "HTML structure verified."